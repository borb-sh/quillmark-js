quill:
  name: usaf_memo
  version: 0.0.0
  backend: typst
  description: U.S. Air Force and Space Force Official Memorandum. A copy of usaf_memo@0.3.0 (tonguetoquill/airmark-quiver), held here at 0.0.0 as the JS tier's conformance fixture.

typst:
  plate_file: plate.typ

main:
  description: "Write the body as plain paragraphs. They're numbered for you, and bullets become lettered subparagraphs. Use a block quote for lines that shouldn't be numbered, like a list of names."
  ui:
    groups: [addressing, letterhead, classification, additional]
  fields:
    memo_for:
      type: array
      items:
        type: plaintext
        inline: true
      ui:
        group: addressing
        compact: true
      description: "Each recipient's office symbol, one per line. To address a person, add their rank and name in parentheses, for example 'ORG/SYMBOL (LT COL JANE DOE)'. For a long list, enter 'SEE DISTRIBUTION' and list everyone under Distribution."

    memo_from:
      type: array
      items:
        type: plaintext
        inline: true
      default: []
      ui:
        group: addressing
        compact: true
      description: "Your office symbol. If any recipient is off your installation, add your full mailing address below it. Leave blank for a memorandum for record."

    subject:
      type: richtext
      inline: true
      ui:
        group: addressing
      description: "A brief subject in title case. Put any suspense date in parentheses at the end."
    
    date:
      type: date
      default: ""
      ui:
        group: addressing
        compact: true
      description: "The date you sign. Leave blank to add a fillable date field to the PDF instead."
      
    authority_line:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: addressing
        compact: true
      description: "Usually blank. When you sign on the commander's behalf or state the headquarters' position, enter 'FOR THE COMMANDER'. It prints above the signature block."

    signature_block:
      type: array
      items:
        type: plaintext
        inline: true
      ui:
        group: addressing
        compact: true
      description: "Your name in uppercase, grade, and service on the first line, for example 'FIRST M. LAST, Capt, USAF'. Your duty title on the second."

    letterhead_title:
      type: array
      items:
        type: plaintext
        inline: true
      default:
        - DEPARTMENT OF THE AIR FORCE
      ui:
        group: letterhead
      description: "The letterhead, in uppercase. Keep the first line unless you work for a joint command or a DoW agency, and add your unit's full name on the lines below it."

    letterhead_seal:
      type: enum
      values:
        - dow
        - dod
      default: dow
      ui:
        group: letterhead
        compact: true
      description: "The seal at the top left of the letterhead: Department of War or Department of Defense."

    letterhead_seal_subtitle:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: letterhead
        compact: true
      description: "An optional line in bold capitals under the seal."

    tag_line:
      type: richtext
      inline: true
      default: ""
      ui:
        group: letterhead
        compact: true
      description: "Your unit's motto, centered at the bottom of every page."

    classification:
      type: enum
      values:
        - UNCLASSIFIED
        - CUI
        - CONFIDENTIAL
        - SECRET
        - TOP SECRET
      default: ""
      ui:
        group: classification
        compact: true
      description: "The classification banner at the top and bottom of every page. Leave blank for an unclassified document."
      variants:
        CUI:
          controlled_by:
            type: plaintext
            inline: true
            description: "The office that designated this information as CUI, for example 'SAF/AA'."
          poc:
            type: plaintext
            inline: true
            description: "Who to contact with questions about this CUI, with phone and email, for example 'Capt J. Smith, DSN 555-1234, john.smith@us.af.mil'."
          category:
            type: plaintext
            inline: true
            default: ""
            description: "The category from the DoD CUI Registry, for example 'CTI' or 'PRVCY'."
          limited_dissemination:
            type: plaintext
            inline: true
            default: ""
            description: "A dissemination control for the CUI block, for example 'FEDONLY' or 'NOFORN'. To add one to the banner, use Dissemination."

    dissemination:
      type: plaintext
      inline: true
      default: ""
      ui:
        group: classification
        compact: true
      description: "A control added to the end of the banner. For example, 'NF' prints as CUI//NF."

    references:
      type: array
      items:
        type: richtext
        inline: true
      default: []
      ui:
        group: additional
      description: "Cite each by organization, type, date, and title. One reference prints after the subject; two or more print as a lettered list."

    cc:
      type: array
      items:
        type: plaintext
        inline: true
      default: []
      ui:
        group: additional
      description: Offices or people receiving a courtesy copy, one per line.

    distribution:
      type: array
      items:
        type: plaintext
        inline: true
      default: []
      ui:
        group: additional
      description: "Everyone the memo goes to, when Memo For says 'SEE DISTRIBUTION'."

    attachments:
      type: array
      items:
        type: richtext
        inline: true
      default: []
      ui:
        group: additional
      description: "Attachments in the order the memo mentions them. Describe each briefly and include its date. Don't write 'as stated'."

    memo_style:
      type: enum
      values:
        - usaf
        - daf
      default: usaf
      ui:
        group: additional
        compact: true
      description: "USAF for most memos, DAF for headquarters memos. DAF style dates as 'September 15, 2026' and indents paragraphs instead of numbering them."

    font_size:
      type: number
      default: 12
      ui:
        group: additional
        compact: true
      description: "Body text size in points. The standard is 12."

card_kinds:
  indorsement:
    title: Routing indorsement
    description: "A reply to the memo, or a forward to the next office. Indorsements are numbered in order: 1st Ind, 2d Ind, and so on."
    ui:
      groups: [addressing, additional]
    seed:
      from: ORG/SYMBOL
      for: ORG/SYMBOL
      signature_block:
        - FIRST M. LAST, Rank, USAF
        - Duty Title
    fields:
      from:
        type: plaintext
        inline: true
        ui:
          group: addressing
          compact: true
        description: "The endorser's office symbol."
      for:
        type: plaintext
        inline: true
        ui:
          group: addressing
          compact: true
        description: "The office the indorsement goes to."
      date:
        type: date
        default: ""
        ui:
          group: addressing
          compact: true
        description: "The date the endorser signs. Leave blank to add a fillable date field to the PDF instead."
      authority_line:
        type: plaintext
        inline: true
        default: ""
        ui:
          group: addressing
          compact: true
        description: "Usually blank. When the endorser signs on the commander's behalf, enter 'FOR THE COMMANDER'."
      signature_block:
        type: array
        items:
          type: plaintext
          inline: true
        ui:
          group: addressing
          compact: true
        description: "The endorser's name in uppercase, grade, and service on the first line, for example 'FIRST M. LAST, Capt, USAF'. Their duty title on the second."
      format:
        type: enum
        values:
          - standard
          - informal
          - separate_page
        default: standard
        ui:
          group: additional
          compact: true
        description: "Standard continues on the same page and moves to a new one if it doesn't fit. Separate page always starts a new page. Informal leaves out the header."
      action:
        type: enum
        values:
          - undecided
          - approve
          - disapprove
        default: ""
        ui:
          group: additional
          compact: true
        description: "The endorser's decision. The last indorsement prints Approve/Disapprove and earlier ones print Concur/Nonconcur, with the choice underlined. Choose undecided to mark it by hand, or leave blank to omit."
