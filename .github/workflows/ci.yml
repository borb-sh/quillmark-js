# The gate in two jobs that run at once, each a run of the root's verbs and neither naming a
# package: `check` is every verb but the suites, `test` is the suites. Each builds for itself,
# since the suites spawn and read built artifacts too. One test loads the built client in a
# browser (CLAUDE.md §Verification), which the runner image's Google Chrome answers; nothing
# here installs one.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release-prepare.yml opens the release PR as `GITHUB_TOKEN`, whose events fire no workflow
  # runs, so it dispatches this workflow at the release branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gate:fast
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:pack
      # The deploy, laid from the tarball rather than the worktree: a `files` field that stopped
      # shipping the client passes every verb above and fails in a consumer's deploy. `npm pack`
      # runs `prepack`, so this is the published artifact.
      - name: Deploy layout, from the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/tool"
          npm pack ./packages/quillkit --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/tool" --strip-components=1
          node "$RUNNER_TEMP/tool/dist/bin/quillkit.js" site --quiver fixtures --out "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html" \
            || { echo "::error::the tarball laid no client at the site root"; exit 1; }
          test -f "$RUNNER_TEMP/site/quiver/quiver.json" \
            || { echo "::error::the tarball laid no quiver under the site"; exit 1; }
          node scripts/check-style.mjs --built "$RUNNER_TEMP/site"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
