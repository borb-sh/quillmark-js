# Publish one package, on the merge of the PR for the branch release-prepare.yml pushed.
# The branch name carries what is being released; package.json is what proves it.
# Everything that can fail freely runs before the tag, because the tag is the last
# point at which a failure costs nothing: a dangling tag is deleted, a published
# version is permanent.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# One release at a time per RELEASE BRANCH. A group holds one pending run, so a group
# shared across packages lets a third merge displace the second before its first step,
# and `cancel-in-progress: false` protects the running job rather than the queued one. A
# cancelled run is not a failed one, so an evicted release publishes nothing and notifies
# nobody. Per branch, a re-run of one release supersedes its own predecessor and releases
# of different packages do not queue against each other.
concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # npm Trusted Publishing (OIDC token exchange); no stored token.
      id-token: write
      # The tag and the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, for the `git tag` below: a push that would clobber an existing one
          # fails here rather than on the remote.
          fetch-depth: 0
          # The merge commit this event names rather than `main`, which is whatever
          # landed while this run queued. One commit gates, is tagged, is built and is
          # published, so the tag names the bytes.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the release from the branch name
        id: release
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ ! "$BRANCH" =~ ^release/([a-z]+)-v(.+)$ ]]; then
            echo "::error::$BRANCH is not release/<package>-v<version>"
            exit 1
          fi
          PKG="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          # The branch name is a claim and package.json is the fact; a mismatch
          # would tag one version and publish another.
          ACTUAL=$(node -p "require('./packages/$PKG/package.json').version")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::branch says v$VERSION, packages/$PKG/package.json says v$ACTUAL"
            exit 1
          fi

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          # The registry name, read rather than spelled from the directory: not every
          # package here is scoped, and a hardcoded `@quillmark/` would name a package
          # that does not exist for the ones that are not.
          echo "name=$(node -p "require('./packages/$PKG/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${PKG}-v${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # ci.yml's verbs through the suite, in one script and in its order; there they
      # are separate steps to buy failure attribution, here they only need to pass.
      # `build` is among them because the suite reads what it writes, and it stays
      # workspace-wide: the suite is the whole workspace's whichever package is being
      # released, so a scoped build leaves quillkit's bin or its client missing.
      - name: Gate
        run: npm run gate

      # The tarball, packed once and published below, so what the checks read is what
      # ships. `npm pack` on a directory runs its `prepack`, which is the build the
      # publish would otherwise run after the checks, on a dist it had already deleted.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack "./packages/${{ steps.release.outputs.pkg }}" \
            --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          echo "tgz=$(echo "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"

      # ci.yml's last verb, aimed at the tarball rather than at the worktree: publint
      # takes a file path as the package, so the manifest it reads and the files it
      # resolves against are the published ones.
      - name: Package (publint)
        run: |
          npm run check:pack -w packages/${{ steps.release.outputs.pkg }} \
            -- "${{ steps.pack.outputs.tgz }}"

      # ci.yml's deploy rehearsal, which is quillkit's alone: it is the only package
      # carrying a client, and a `files` field that stopped shipping it passes every
      # check above and fails in a consumer's deploy. Extracted beside the worktree
      # rather than inside it, so nothing resolves out of the workspace and the bin
      # runs on the bytes it ships.
      - name: Deploy layout, from the tarball
        if: steps.release.outputs.pkg == 'quillkit'
        run: |
          mkdir -p "$RUNNER_TEMP/tool"
          tar -xzf "${{ steps.pack.outputs.tgz }}" -C "$RUNNER_TEMP/tool" --strip-components=1
          node "$RUNNER_TEMP/tool/dist/bin/quillkit.js" site --quiver fixtures --out "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html" \
            || { echo "::error::the tarball laid no client at the site root"; exit 1; }
          test -f "$RUNNER_TEMP/site/quiver.qv" \
            || { echo "::error::the tarball laid no quiver beside the client"; exit 1; }
          # The stamp the notes below render. Asserted here rather than there,
          # because that step runs after the tag.
          test -f "$RUNNER_TEMP/tool/dist/client/carried.json" \
            || { echo "::error::the tarball carries no stamp of what it compiles in"; exit 1; }
          node scripts/check-style.mjs --built "$RUNNER_TEMP/site"

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" \
            -m "${{ steps.release.outputs.name }} ${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.tag }}"

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      # Skipping a version the registry already has is what makes the job safe to
      # re-run, and it is the whole of the first-publish bootstrap: a package with
      # no versions has no trusted publisher to configure, so its first upload is
      # a hand publish from the release branch and this run agrees rather than
      # 403s on it.
      #
      # The tarball rather than the workspace directory: a directory spec runs `prepack`
      # here, which would delete the dist the checks read and ship a second build of it.
      # Provenance is the same either way, its subject being the uploaded tarball's
      # digest.
      - name: Publish
        run: |
          NAME="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"
          if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "${NAME}@${VERSION} is already on the registry; nothing to publish."
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.tgz }}" --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ steps.release.outputs.pkg }}"
          NAME="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"

          # The version's own section, verbatim: everything between its heading
          # and the next one.
          awk -v v="## v${VERSION} - " \
            'index($0, v) == 1 {f=1; next} /^## / && f {exit} f {print}' \
            "packages/$PKG/CHANGELOG.md" > notes.md || true
          # A whitespace-only section would publish blank notes, and `-s` alone is
          # true for one.
          grep -q '[^[:space:]]' notes.md || echo "${NAME} ${VERSION}" > notes.md

          # What the tarball compiles in, rendered from the stamp inside it rather than
          # read off this tree a second time (`carried.mjs`). The extraction above laid
          # it there; a package carrying no client has no stamp and gets no line.
          CARRIED="$RUNNER_TEMP/tool/dist/client/carried.json"
          if [ -f "$CARRIED" ]; then
            { node scripts/carried.mjs --line --from "$CARRIED"; echo; cat notes.md; } \
              > notes.new && mv notes.new notes.md
          fi

          # No release is the repository's latest: the packages release on their
          # own clocks, so whichever went last would claim the label for all.
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${NAME} ${VERSION}" \
            --notes-file notes.md \
            --latest=false
