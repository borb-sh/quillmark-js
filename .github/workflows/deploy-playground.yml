# Deploys the playground (packages/playground → adapter-static SPA) to GitHub Pages
# on every push to main. Separate from ci.yml, which gates PRs and never deploys.
# The Actions-based Pages pipeline (no gh-pages branch): build → upload artifact
# → deploy. The site is served at the root of play.quillmark.dev, the custom
# domain set in the repository's Pages settings. `configure-pages` feeds the
# base path Pages reports to the build as BASE_PATH, empty under that domain;
# the playground's vite.config.ts reads it into paths.base.
name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# `build` only reads; `deploy` alone mints a Pages deployment (pages + id-token), so the
# install and build never hold the right to publish the site.
permissions:
  contents: read

# One live deployment at a time; a newer push supersedes a queued one, but a
# running publish is left to finish rather than cancelled mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` reads the site's settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - run: npm ci

      - name: Build playground
        env:
          # Empty under the custom domain; vite.config.ts reads it into
          # paths.base.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -w packages/playground

      - name: SPA route shells
        # adapter-static emits only the index.html shell (prerender is off), and the
        # client router resolves the route. Pages answers /playground with a 200 from
        # playground.html, the form Kit's links take under its default trailingSlash
        # ('never'); any other path gets the same shell as 404.html, with a 404.
        run: |
          cp packages/playground/build/index.html packages/playground/build/playground.html
          cp packages/playground/build/index.html packages/playground/build/404.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/playground/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
