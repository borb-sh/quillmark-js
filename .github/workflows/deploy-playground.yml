# Deploys the playground (packages/playground → adapter-static SPA) to GitHub Pages
# on every push to main. Separate from ci.yml, which gates PRs and never deploys.
# The Actions-based Pages pipeline (no gh-pages branch): build → upload artifact
# → deploy. `configure-pages` feeds the project-subpath base (`/quillmark-js`)
# to the build as BASE_PATH; the playground's vite.config.ts reads it into
# paths.base so assets and links resolve under the subpath.
name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# `deploy` mints a Pages deployment (pages + id-token); `build` only reads.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes a queued one, but a
# running publish is left to finish rather than cancelled mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build playground
        env:
          # `/quillmark-js` for the project site; vite.config.ts reads it
          # into paths.base.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -w packages/playground

      - name: SPA route shells
        # adapter-static emits only the index.html shell (prerender is off), and the
        # client router resolves the route. Pages answers /playground with a 200 from
        # playground.html, the form Kit's links take under its default trailingSlash
        # ('never'); any other path gets the same shell as 404.html, with a 404.
        run: |
          cp packages/playground/build/index.html packages/playground/build/playground.html
          cp packages/playground/build/index.html packages/playground/build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
