# Cut a release for one package: bump its version, promote its curated
# `## Unreleased` section to the version's own, push the release branch, and open the
# PR. Merging that PR is what tags and publishes (release.yml). Versions are
# independent, so a release names its package and leaves the other's alone.
#
# Opening it needs Settings → Actions → "Allow GitHub Actions to create and approve
# pull requests", which no `permissions:` block grants. A PR opened by `GITHUB_TOKEN`
# gets no `pull_request` run, so the same step dispatches ci.yml at the branch: the
# release PR is the one change that must not merge unchecked.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - svelte
          - quiver
          - fonts
          - quillkit
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The ci.yml dispatch.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # This job rewrites the lockfile, so it writes under the npm the
      # `packageManager` pin names rather than whichever the runner ships. A bump
      # under a mismatched npm resolves optional dependencies differently and
      # desyncs the lock, which then fails `npm ci` on the release PR alone.
      - name: Enable corepack
        run: corepack enable

      - name: Bump the version
        id: version
        run: |
          PKG="${{ inputs.package }}"
          CURRENT=$(node -p "require('./packages/$PKG/package.json').version")

          npm version "${{ inputs.bump }}" -w "packages/$PKG" \
            --no-git-tag-version --allow-same-version >/dev/null
          NEXT=$(node -p "require('./packages/$PKG/package.json').version")

          # quillkit carries the quiver and the font suite at exactly their workspace
          # versions (QUILLKIT §"One pin"), so a release of either moves that pin with it.
          if [ "$PKG" = quiver ] || [ "$PKG" = fonts ]; then
            npm pkg set "dependencies.@quillmark/$PKG=$NEXT" -w packages/quillkit
          fi

          # Reify the lock the one way every other install produces it, rather
          # than trusting npm version's partial rewrite.
          npm install --package-lock-only --no-audit --no-fund

          # The registry name, read rather than spelled from the directory: not every
          # package here is scoped, and a hardcoded `@quillmark/` would name a package
          # that does not exist for the ones that are not.
          echo "name=$(node -p "require('./packages/$PKG/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $PKG $CURRENT → $NEXT"

      - name: Refuse a release already in flight
        run: |
          BRANCH="release/${{ inputs.package }}-v${{ steps.version.outputs.next }}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::$BRANCH exists; that release is already open."
            exit 1
          fi

      - name: Promote the curated section
        run: |
          PKG="${{ inputs.package }}"
          VERSION="${{ steps.version.outputs.next }}"
          FILE="packages/$PKG/CHANGELOG.md"

          # `## Unreleased` is a permanent fixture at the top of the file: an
          # entry is written into it by the change that earns it, and a release
          # names the body already under it. Splicing the version heading in below
          # the fixture is the whole promotion — the entries do not move, and the
          # heading stays for the next cycle. Only the first fixture is read; a
          # later one is stray data and passes through untouched.
          awk -v hdr="## v${VERSION} - $(date +%Y-%m-%d)" \
            '!done && $0 == "## Unreleased" { print; print ""; print hdr; done=1; next } { print }' \
            "$FILE" > CHANGELOG.new && mv CHANGELOG.new "$FILE"

      - name: Push the branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ inputs.package }}"
          NAME="${{ steps.version.outputs.name }}"
          VERSION="${{ steps.version.outputs.next }}"
          BRANCH="release/${PKG}-v${VERSION}"

          # Coverage cross-check: what landed under this package since its last
          # release, for the reviewer to read the curated section against. It
          # lives in the PR rather than in CHANGELOG.md, so nothing rides onto
          # main waiting to be deleted. Path-filtered, so a package's tags and a
          # package's commits answer for that package alone.
          LAST=$(git tag -l --sort=-v:refname \
            | grep -E "^${PKG}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
          git log --no-merges --pretty='- %s' ${LAST:+"${LAST}..HEAD"} \
            -- "packages/$PKG" > commits.md

          {
            echo "Automated version bump: \`${NAME}\` → \`v${VERSION}\`."
            echo
            echo "**Before merging:** read the \`## v${VERSION}\` section of \`packages/${PKG}/CHANGELOG.md\` on this branch. It is the curated \`## Unreleased\` body, promoted, and it becomes the GitHub Release notes verbatim."
            echo
            if [ "$PKG" = quillkit ]; then
              echo "The notes open with one line this section does not carry: what the tarball compiles in, rendered from its own \`dist/client/carried.json\`, so it names the copies the merge commit builds rather than the ones on this branch."
              echo
            fi
            echo "Merging tags \`${PKG}-v${VERSION}\` and publishes \`${NAME}\`."
            echo
            echo "The checks here come from a dispatched \`CI\` run at the branch head: a PR opened by \`GITHUB_TOKEN\` gets no \`pull_request\` run."
            echo
            echo "<details><summary>Commits touching <code>packages/${PKG}</code> since ${LAST:-the first commit}</summary>"
            echo
            cat commits.md
            echo
            echo "</details>"
          } > pr-body.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "packages/$PKG/package.json" "packages/$PKG/CHANGELOG.md" package-lock.json
          if [ "$PKG" = quiver ] || [ "$PKG" = fonts ]; then git add packages/quillkit/package.json; fi
          git commit -m "chore(release): ${NAME} v${VERSION}"
          git push -u origin "$BRANCH"

          PR=$(gh pr create \
            --title "chore(release): ${NAME} v${VERSION}" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH")

          # The checks, dispatched rather than triggered. Only this first commit needs
          # it; a later push to the branch is a human's and fires `synchronize`.
          gh workflow run ci.yml --ref "$BRANCH"

          {
            echo "## Release PR"
            echo
            echo "[chore(release): ${NAME} v${VERSION}](${PR})"
          } >> "$GITHUB_STEP_SUMMARY"
